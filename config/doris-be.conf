# Doris Backend 配置文件

# 基础配置
be_port = 9060
webserver_port = 8040
heartbeat_service_port = 9050
brpc_port = 8060

# 存储配置
storage_root_path = /opt/data/doris/be/storage

# 日志配置
sys_log_dir = /opt/logs
sys_log_level = INFO
sys_log_roll_mode = SIZE-MB-1024
sys_log_roll_num = 10

# 内存配置
mem_limit = 80%
chunk_reserved_bytes_limit = 2147483648

# 网络配置
priority_networks = 127.0.0.1/24

# 性能配置
num_threads_per_core = 3
compress_rowbatches = true
serialize_batch = true

# 存储引擎配置
default_num_rows_per_column_file_block = 1024
pending_data_expire_time_sec = 1800
inc_rowset_expired_sec = 1800

# 查询配置
fragment_pool_thread_num_min = 64
fragment_pool_thread_num_max = 2048
fragment_pool_queue_size = 2048

# 导入配置
push_worker_count_normal_priority = 3
push_worker_count_high_priority = 3

# 压缩配置
max_compaction_threads = 5
base_compaction_num_threads_per_disk = 1
cumulative_compaction_num_threads_per_disk = 1