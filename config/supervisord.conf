[supervisord]
nodaemon=true
logfile=/opt/logs/supervisord.log
pidfile=/var/run/supervisord.pid
childlogdir=/opt/logs

[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

# SSH 服务
[program:sshd]
command=/usr/sbin/sshd -D
autostart=true
autorestart=true
stdout_logfile=/opt/logs/sshd.log
stderr_logfile=/opt/logs/sshd_error.log

# PostgreSQL 数据库
[program:postgresql]
command=/usr/lib/postgresql/13/bin/postgres -D /var/lib/postgresql/13/main -c config_file=/etc/postgresql/13/main/postgresql.conf
user=postgres
autostart=true
autorestart=true
stdout_logfile=/opt/logs/postgresql.log
stderr_logfile=/opt/logs/postgresql_error.log

# Flink JobManager
[program:flink-jobmanager]
command=/opt/flink/bin/jobmanager.sh start-foreground
autostart=true
autorestart=true
stdout_logfile=/opt/logs/flink-jobmanager.log
stderr_logfile=/opt/logs/flink-jobmanager_error.log
environment=JAVA_HOME="/usr/lib/jvm/java-11-openjdk-amd64"

# Flink TaskManager
[program:flink-taskmanager]
command=/opt/flink/bin/taskmanager.sh start-foreground
autostart=true
autorestart=true
stdout_logfile=/opt/logs/flink-taskmanager.log
stderr_logfile=/opt/logs/flink-taskmanager_error.log
environment=JAVA_HOME="/usr/lib/jvm/java-11-openjdk-amd64"

# Fluss Server
[program:fluss-server]
command=/opt/fluss/bin/fluss-daemon.sh start-foreground server
autostart=true
autorestart=true
stdout_logfile=/opt/logs/fluss-server.log
stderr_logfile=/opt/logs/fluss-server_error.log
environment=JAVA_HOME="/usr/lib/jvm/java-11-openjdk-amd64"

# Doris Frontend
[program:doris-fe]
command=/opt/doris/fe/bin/start_fe.sh --daemon
autostart=true
autorestart=true
stdout_logfile=/opt/logs/doris-fe.log
stderr_logfile=/opt/logs/doris-fe_error.log
environment=JAVA_HOME="/usr/lib/jvm/java-11-openjdk-amd64"

# Doris Backend
[program:doris-be]
command=/opt/doris/be/bin/start_be.sh --daemon
autostart=true
autorestart=true
stdout_logfile=/opt/logs/doris-be.log
stderr_logfile=/opt/logs/doris-be_error.log

# Grafana
[program:grafana]
command=/usr/sbin/grafana-server --config=/etc/grafana/grafana.ini --pidfile=/var/run/grafana/grafana-server.pid --packaging=deb cfg:default.paths.logs=/var/log/grafana cfg:default.paths.data=/var/lib/grafana cfg:default.paths.plugins=/var/lib/grafana/plugins cfg:default.paths.provisioning=/etc/grafana/provisioning
user=grafana
autostart=true
autorestart=true
stdout_logfile=/opt/logs/grafana.log
stderr_logfile=/opt/logs/grafana_error.log

# 数据生成器
[program:data-generator]
command=/usr/bin/python3 /opt/scripts/data_generator.py
autostart=true
autorestart=true
stdout_logfile=/opt/logs/data-generator.log
stderr_logfile=/opt/logs/data-generator_error.log

# 健康检查
[program:health-check]
command=/usr/bin/python3 /opt/scripts/health_check.py
autostart=true
autorestart=true
stdout_logfile=/opt/logs/health-check.log
stderr_logfile=/opt/logs/health-check_error.log