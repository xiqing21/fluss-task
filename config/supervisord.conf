[supervisord]
nodaemon=true
logfile=/opt/logs/supervisord.log
pidfile=/var/run/supervisord.pid
childlogdir=/opt/logs

[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

# SSH 服务
[program:sshd]
command=/usr/sbin/sshd -D
autostart=true
autorestart=true
stdout_logfile=/opt/logs/sshd.log
stderr_logfile=/opt/logs/sshd_error.log

# PostgreSQL 数据库
[program:postgresql]
command=/usr/lib/postgresql/12/bin/postgres -D /var/lib/postgresql/12/main -c config_file=/etc/postgresql/12/main/postgresql.conf
user=postgres
autostart=true
autorestart=true
stdout_logfile=/opt/logs/postgresql.log
stderr_logfile=/opt/logs/postgresql_error.log

# Flink 和 Fluss 集群（使用基础镜像的启动脚本）
[program:flink-fluss-cluster]
command=/opt/flink-fluss-delta-join/start-flink-fluss.sh
autostart=true
autorestart=true
stdout_logfile=/opt/logs/flink-fluss-cluster.log
stderr_logfile=/opt/logs/flink-fluss-cluster_error.log
environment=JAVA_HOME="/usr/lib/jvm/java-11-openjdk-amd64"

# Doris Frontend
[program:doris-fe]
command=/opt/doris/fe/bin/start_fe.sh --daemon
autostart=true
autorestart=true
stdout_logfile=/opt/logs/doris-fe.log
stderr_logfile=/opt/logs/doris-fe_error.log
environment=JAVA_HOME="/usr/lib/jvm/java-11-openjdk-amd64"

# Doris Backend
[program:doris-be]
command=/opt/doris/be/bin/start_be.sh --daemon
autostart=true
autorestart=true
stdout_logfile=/opt/logs/doris-be.log
stderr_logfile=/opt/logs/doris-be_error.log

# Grafana
[program:grafana]
command=/usr/sbin/grafana-server --config=/etc/grafana/grafana.ini --pidfile=/var/run/grafana/grafana-server.pid --packaging=deb cfg:default.paths.logs=/var/log/grafana cfg:default.paths.data=/var/lib/grafana cfg:default.paths.plugins=/var/lib/grafana/plugins cfg:default.paths.provisioning=/etc/grafana/provisioning
user=grafana
autostart=true
autorestart=true
stdout_logfile=/opt/logs/grafana.log
stderr_logfile=/opt/logs/grafana_error.log

# 数据生成器
[program:data-generator]
command=/usr/bin/python3 /opt/scripts/data_generator.py
autostart=true
autorestart=true
stdout_logfile=/opt/logs/data-generator.log
stderr_logfile=/opt/logs/data-generator_error.log

# 健康检查
[program:health-check]
command=/usr/bin/python3 /opt/scripts/health_check.py
autostart=true
autorestart=true
stdout_logfile=/opt/logs/health-check.log
stderr_logfile=/opt/logs/health-check_error.log

# 自动恢复服务
[program:auto-recovery]
command=/usr/bin/python3 /opt/scripts/auto_recovery.py daemon
autostart=true
autorestart=true
stdout_logfile=/opt/logs/auto-recovery.log
stderr_logfile=/opt/logs/auto-recovery_error.log