# Doris Frontend 配置文件

# 基础配置
meta_dir = /opt/data/doris/fe/meta
http_port = 8030
rpc_port = 9020
query_port = 9030
edit_log_port = 9010

# 日志配置
sys_log_dir = /opt/logs
sys_log_level = INFO
sys_log_roll_mode = SIZE-MB-1024
sys_log_roll_num = 10

# 内存配置
JAVA_OPTS = "-Xmx2048m -XX:+UseMembar -XX:SurvivorRatio=8 -XX:MaxTenuringThreshold=7 -XX:+PrintGCDateStamps -XX:+PrintGCDetails -XX:+UseConcMarkSweepGC -XX:+UseParNewGC -XX:+CMSClassUnloadingEnabled -XX:-CMSParallelRemarkEnabled -XX:CMSInitiatingOccupancyFraction=80 -XX:SoftRefLRUPolicyMSPerMB=0 -Xloggc:/opt/logs/fe.gc.log"

# 集群配置
priority_networks = 127.0.0.1/24

# 存储配置
storage_flood_stage_usage_percent = 95
storage_flood_stage_left_capacity_bytes = 1073741824

# 查询配置
qe_max_connection = 1024
max_conn_per_user = 100

# 导入配置
max_load_timeout_second = 259200
min_load_timeout_second = 1

# 备份配置
backup_job_default_timeout_ms = 86400000

# 安全配置
enable_auth_check = false